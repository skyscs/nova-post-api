name: Deploy NovaPost API

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint
        continue-on-error: true

      - name: Build application
        run: bun run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Navigate to project directory
            cd /home/${{ secrets.USERNAME }}/nova-post-api || mkdir -p /home/${{ secrets.USERNAME }}/nova-post-api && cd /home/${{ secrets.USERNAME }}/nova-post-api
            
            # Pull latest changes
            git fetch origin
            git reset --hard origin/main
            
            # Create .env file from secrets
            cat > .env << EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            PORT=${{ secrets.APP_PORT }}
            NODE_ENV=production
            NOVA_POST_API_URL=${{ secrets.NOVA_POST_API_URL }}
            UPDATE_CRON=${{ secrets.UPDATE_CRON }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL }}
            EOF
            
            # Build and restart services
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
            
            # Clean up old images
            docker image prune -f
            
            # Wait for services to be ready
            sleep 30
            
            # Check if services are running
            docker-compose ps
            
            # Test API health
            curl -f http://localhost:${{ secrets.APP_PORT }}/api/v1/system/health || exit 1 