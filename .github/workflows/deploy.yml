name: Deploy Nova Post API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          set -e
          
          # Create directory if not exists
          mkdir -p /var/www/nova-post-api
          cd /var/www/nova-post-api
          
          # Backup current version if exists
          if [ -d "current" ]; then
            rm -rf backup 2>/dev/null || true
            mv current backup 2>/dev/null || true
          fi
          
          # Clone fresh code
          git clone https://github.com/${{ github.repository }}.git current
          cd current
          
          # Create production environment file
          cat > .env << 'EOF'
          NODE_ENV=production
          PORT=3002
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          NOVA_POST_API_URL=https://api-cdn.novapost.pl/dictionary/divisions/mobile/full/en/versions.json
          EOF
          
          # Stop old containers
          docker-compose -f docker-compose.prod.yml down 2>/dev/null || true
          
          # Build and start new containers
          docker-compose -f docker-compose.prod.yml up -d --build
          
          # Wait for service to be ready
          echo "Waiting for service to start..."
          sleep 30
          
          # Health check
          for i in {1..10}; do
            if curl -f http://localhost:3002/api/v1/system/health; then
              echo "✅ Deployment successful!"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "❌ Health check failed! Rolling back..."
              docker-compose -f docker-compose.prod.yml down
              if [ -d "../backup" ]; then
                rm -rf ../current
                mv ../backup ../current
                cd ../current
                docker-compose -f docker-compose.prod.yml up -d
              fi
              exit 1
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          
          # Setup Nginx configuration
          if [ ! -f "/etc/nginx/sites-available/nova-post-api" ]; then
            cat > /tmp/nova-post-api-nginx << 'NGINXEOF'
          server {
              listen 80;
              server_name nova-post-api.ukrpop.com;
              
              # Security headers
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header X-Content-Type-Options "nosniff" always;
              
              location / {
                  proxy_pass http://localhost:3002;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
                  
                  # Timeouts
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }
          }
          NGINXEOF
            
            sudo mv /tmp/nova-post-api-nginx /etc/nginx/sites-available/nova-post-api
            sudo ln -sf /etc/nginx/sites-available/nova-post-api /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl reload nginx
            
            # Get SSL certificate
            sudo certbot --nginx -d nova-post-api.ukrpop.com --non-interactive --agree-tos --email admin@ukrpop.com --redirect
          fi
          